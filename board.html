<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사건파일 · 수사 상황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
:root{
  --desk:#24343a; --desk-2:#2d4148; --paper:#f3f6f3; --paper-2:#e9efeb; --ink:#1c2a2e; --ink-soft:#4f6266; --rule:#b9cbc4;
  --stamp:#b8322a; --ok:#1e7566; --gold:#a97a14; --gold-bg:#f5ecd2;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --mono:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  --fs:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;font-size:var(--fs)}
button{font-family:inherit}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;color:#e8efec;flex-wrap:wrap;border-bottom:1px solid #3b5158}
.code{font-family:var(--mono);font-size:13px;color:#9fb5ad;letter-spacing:.08em;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.title{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:14px;padding:5px 10px;border-radius:6px;background:var(--desk-2);color:#9fb5ad;cursor:default}
.steps span.on{background:var(--gold);color:#fff;font-weight:700}
.steps.t span{cursor:pointer}
.sp{flex:1}
.tool{background:var(--desk-2);color:#e8efec;border:1px solid #4a636a;border-radius:8px;padding:7px 12px;font-size:15px;cursor:pointer}
.tool.red{background:var(--stamp);border-color:var(--stamp);font-weight:700}
.timer{font-family:var(--mono);font-size:20px;color:#fff;min-width:64px;text-align:right}
.wrap{flex:1;display:flex;gap:16px;padding:16px 20px;min-height:0}
.col{overflow:auto;min-height:0}
.paper{background:var(--paper);border-radius:14px;padding:18px 22px;margin-bottom:14px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.paper h2{font-family:var(--display);font-size:1.15em;margin:0 0 10px}
.paper h3{font-size:.85em;margin:12px 0 6px}
.muted{color:var(--ink-soft);font-size:.72em;line-height:1.6}
.lead p{font-size:.95em;line-height:1.75;margin:0 0 10px}
.stamp{display:inline-block;font-family:var(--display);font-weight:800;color:var(--stamp);border:4px solid var(--stamp);border-radius:10px;padding:4px 16px;transform:rotate(-5deg)}
/* 결함 지도 */
.sec{margin-bottom:12px}
.sec .nm{font-family:var(--mono);font-size:.6em;color:var(--ok);font-weight:700}
.txt{font-size:1em;line-height:1.85;word-break:keep-all}
.s{border-radius:5px;padding:2px 1px;cursor:pointer}
.s.sel{outline:3px solid var(--ink);outline-offset:1px}
.s.found{box-shadow:inset 0 -4px 0 var(--stamp)}
.tag{display:inline-block;font-size:.5em;font-weight:700;color:#fff;background:var(--stamp);border-radius:4px;padding:1px 6px;vertical-align:.4em;margin:0 2px}
.cnt{font-family:var(--mono);font-size:.5em;font-weight:700;color:#8a5a00;vertical-align:.6em}
.big{font-family:var(--mono);font-size:3.2em;font-weight:700;line-height:1;color:var(--stamp)}
.big small{font-size:.4em;color:var(--ink-soft)}
.fl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;margin-bottom:6px;font-size:.8em;background:#fff;border:1.5px dashed var(--rule)}
.fl.on{border:1.5px solid var(--stamp);background:#fff3f1}
.fl .c{font-family:var(--mono);font-size:.75em;color:var(--ink-soft);width:44px}
.bar{display:flex;align-items:center;gap:10px;font-size:.75em;margin-bottom:6px}
.bar .b{height:14px;border-radius:7px;background:var(--ok)}
.cm{background:#fff;border-left:6px solid var(--rule);border-radius:10px;padding:10px 14px;margin-bottom:9px;font-size:.78em;line-height:1.55}
.cm.full{border-left-color:var(--stamp)} .cm.part{border-left-color:var(--gold)}
.cm .m{font-size:.75em;color:var(--ink-soft);margin-bottom:3px;display:flex;gap:8px;align-items:center}
.cm .hide{margin-left:auto;font-size:12px;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
/* 복원·심사 */
.vgrid{grid-template-columns:repeat(3,1fr)!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;width:100%;align-content:start}
.orig{font-size:.72em;line-height:1.65;background:var(--paper-2);border-radius:8px;padding:10px 12px;color:var(--ink-soft)}
.rw{font-size:.85em;line-height:1.7;background:#fff;border:2px solid var(--ok);border-radius:8px;padding:10px 14px;white-space:pre-wrap}
.status{font-size:.65em;font-weight:700;color:var(--ok)}
.status.no{color:var(--stamp)}
.gtabs{display:flex;gap:6px;margin-bottom:10px}
.gtabs button{padding:9px 18px;border-radius:9px;border:0;background:var(--desk-2);color:#c9d6d1;font-size:17px;font-weight:700;cursor:pointer}
.gtabs button.on{background:var(--paper);color:var(--ink)}
/* 결과 */
.rank{display:flex;align-items:center;gap:20px;background:#fff;border-radius:14px;padding:16px 22px;margin-bottom:12px;font-size:1.1em;opacity:0;transform:translateY(16px);transition:all .6s}
.rank.in{opacity:1;transform:none}
.rank .no{font-family:var(--mono);font-size:1.4em;font-weight:700;width:90px;white-space:nowrap}
.rank .gr{margin-left:auto;font-family:var(--display);font-weight:800;color:var(--stamp);font-size:1.1em}
.rank .det{font-size:.6em;color:var(--ink-soft)}
.rank.first{outline:4px solid var(--gold);background:var(--gold-bg)}
.login{position:fixed;inset:0;background:rgba(18,28,31,.85);display:none;align-items:center;justify-content:center;z-index:50}
.login.show{display:flex}
.login .box{background:var(--paper);border-radius:14px;padding:24px;width:340px;font-size:16px}
.login input{width:100%;font-size:20px;padding:10px;border:2px solid var(--rule);border-radius:9px;margin:10px 0}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.url{font-family:var(--mono);font-size:.7em;word-break:break-all;margin-top:8px}
.clsbadge{background:var(--paper);color:var(--ink);font-weight:700;border-radius:8px;padding:5px 12px;font-size:15px;letter-spacing:0}
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cls button{padding:14px 8px;border-radius:10px;border:2px solid var(--rule);background:#fff;font-size:18px;font-weight:700;cursor:pointer;line-height:1.3}
.cls button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cls button small{display:block;font-size:12px;font-weight:400;opacity:.8}
.adm h3{font-size:16px;margin:16px 0 8px}
.adm table{width:100%;border-collapse:collapse;font-size:14px}
.adm td,.adm th{border-bottom:1px solid var(--rule);padding:6px 5px;text-align:left;vertical-align:top}
.adm tr.hid td{color:#9aa;text-decoration:line-through}
.adm select,.adm input[type=text]{font-size:15px;padding:6px 8px;border:1.5px solid var(--rule);border-radius:7px}
.adm input[type=checkbox]{width:auto;margin:0 4px 0 0;vertical-align:middle}
.adm td:nth-child(2){white-space:nowrap}
.sbtn{font-size:13px;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.sbtn.red{background:var(--stamp);color:#fff;border-color:var(--stamp)}
</style>
</head>
<body>
<header>
  <div><div class="code" id="code"></div><div class="title" id="title">수사 상황판</div></div>
  <div class="steps" id="steps"></div>
  <span class="sp"></span>
  <span class="timer" id="timer"></span>
  <button class="tool" id="prev" hidden>◀ 이전</button>
  <button class="tool red" id="next" hidden>다음 단계 ▶</button>
  <button class="tool" id="minus">가-</button><button class="tool" id="plus">가+</button>
  <button class="tool" id="peek" hidden></button>
  <button class="tool" id="adminBtn" hidden>반·기록 관리</button>
  <button class="tool" id="loginBtn">교사 로그인</button>
</header>
<div class="wrap" id="wrap"><div class="col" style="flex:1;color:#c9d6d1">불러오는 중...</div></div>
<div class="login" id="admin"><div class="box" style="width:min(1100px,94vw);max-height:90vh;overflow:auto;font-size:16px" id="adminBox"></div></div>
<div class="login" id="login"><div class="box"><b>교사 비밀번호</b><input type="password" id="pin" inputmode="numeric" autocomplete="off"><div style="display:flex;gap:8px"><button class="tool red" id="pinOk" style="flex:1">확인</button><button class="tool" id="pinCancel">닫기</button></div><div id="pinMsg" style="color:var(--stamp);margin-top:8px"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="common.js?v=13"></script>
<script>
let peek = false;   /* 1라운드 발견 위치·4라운드 득표를 칠판에 보일지 (기본: 가림) */
let B = null, D = null, pin = sessionGet('case_pin') || '', sel = null, gtab = 1, cardSel = '', revealDone = false;
let fs = Number(store('case_fs')) || 22;
function sessionGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function sessionSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
const studentURL = location.href.replace(/board\.html.*$/, '').replace(/[?#].*$/, '');

function teacher() { return D && D.teacher; }
function phase() { return D ? D.state.phase : 0; }
function sentence(k) { const [a, b] = k.split('-').map(Number); return B.sections[a] ? B.sections[a].sentences[b] : ''; }
function secName(k) { return B.sections[Number(k.split('-')[0])]?.name || ''; }

function renderHeader() {
  document.documentElement.style.setProperty('--fs', fs + 'px');
  $('title').textContent = STORY.title + ' · 수사 상황판';
  $('steps').className = 'steps' + (teacher() ? ' t' : '');
  $('steps').innerHTML = B.phases.map((p, i) => `<span class="${i === phase() ? 'on' : ''}" data-ph="${i}">${i + 1}. ${esc(p)}</span>`).join('');
  $('prev').hidden = $('next').hidden = $('adminBtn').hidden = !teacher();
  $('peek').hidden = !(teacher() && (phase() === 1 || phase() === 4));
  $('peek').textContent = peek ? (phase() === 1 ? '👁 위치 보임' : '👁 득표 보임') : (phase() === 1 ? '🔒 위치 가림' : '🔒 득표 가림');
  $('peek').classList.toggle('red', peek);
  $('code').innerHTML = esc(STORY.code) + (D.state.cls ? ` <span class="clsbadge">${esc(D.state.cls)} 진행 중</span>` : ' <span class="clsbadge" style="background:var(--gold);color:#fff">반을 열어 주세요</span>');
  $('loginBtn').textContent = teacher() ? '교사 모드' : '교사 로그인';
}

/* 0 브리핑 */
function vBrief() {
  return `<div class="col" style="flex:1.4"><div class="paper lead"><div class="code" style="color:var(--stamp)">${STORY.code}</div><h2 style="font-size:1.5em">${STORY.title}</h2>${STORY.lead.map(p => `<p>${esc(p)}</p>`).join('')}</div>
    <div class="paper"><h2>네 가지 임무</h2>${STORY.missions.map((m, i) => `<div style="margin-bottom:8px;font-size:.9em"><b style="font-family:var(--mono);color:var(--stamp)">0${i + 1}</b> <b>${esc(m[0])}</b> · ${esc(m[1])}</div>`).join('')}</div></div>
    <div class="col" style="flex:1"><div class="paper" style="text-align:center"><h2>수사 수첩 접속</h2><div class="qr" id="qr"></div><div class="url">${esc(studentURL)}</div></div>
    <div class="paper"><h2>점수 규칙</h2>${STORY.points.map(p => `<div style="display:flex;font-size:.8em;padding:4px 0;border-bottom:1px dashed var(--rule)"><span>${esc(p[0])}</span><b style="margin-left:auto;font-family:var(--mono)">${p[1]}</b></div>`).join('')}<p class="muted">${esc(STORY.note)}</p></div></div>`;
}

/* 1 결함 지도 */
function vFind() {
  const byKey = {}; D.finds.forEach(f => f.keys.forEach(k => (byKey[k] = byKey[k] || []).push(f)));
  const max = Math.max(1, ...Object.values(byKey).map(a => a.length));
  const foundKeys = {}; D.flawMap.filter(f => f.found).forEach(f => f.keys.forEach(k => (foundKeys[k] = foundKeys[k] || []).push(f)));
  const found = D.flawMap.filter(f => f.found).length;
  const text = B.sections.map((sec, si) => `<div class="sec"><div class="nm">${esc(sec.name)}</div><div class="txt">` + sec.sentences.map((s, j) => {
    const k = si + '-' + j, arr = peek ? (byKey[k] || []) : [], fk = peek ? (foundKeys[k] || []) : [];
    const bg = arr.length ? `background:rgba(255,${Math.round(214 - 50 * arr.length / max)},0,${(0.15 + 0.6 * arr.length / max).toFixed(2)})` : '';
    return `<span class="s ${sel === k ? 'sel' : ''} ${fk.length ? 'found' : ''}" data-k="${k}" style="${bg}">${esc(s)}</span>${fk.map(f => `<span class="tag">${esc(f.card)}</span>`).join('')}${arr.length ? `<span class="cnt">${arr.length}</span>` : ''} `;
  }).join('') + `</div></div>`).join('');

  let side;
  if (sel) {
    const arr = (byKey[sel] || []).slice().reverse();
    side = `<div class="paper"><div style="display:flex;align-items:center"><h2 style="margin:0">[${esc(secName(sel))}]</h2><button class="tool" data-k="${sel}" style="margin-left:auto;background:#fff;color:var(--ink)">닫기</button></div>
      <div class="orig" style="margin:10px 0">${esc(sentence(sel))}</div><h3>이 문장을 짚은 기록 ${arr.length}개</h3>` +
      (arr.map(f => `<div class="cm"><div class="m">${f.group}모둠 · ${esc(f.role)}${teacher() ? `<button class="hide" data-hide="${esc(f.id)}">점수 무효</button>` : ''}</div>${f.problem ? `<div>${esc(f.problem)}</div>` : '<div class="muted">(이유 없이 표시만 함)</div>'}</div>`).join('') || '<p class="muted">아직 없어요.</p>') + `</div>`;
  } else {
    side = `<div class="paper" style="text-align:center"><div class="muted" style="font-size:.7em">우리 반이 찾은 결함</div><div class="big">${found}<small> / ${D.flawMap.length}</small></div></div>
      <div class="paper"><h2>결함 목록</h2>${D.flawMap.map(f => `<div class="fl ${f.found ? 'on' : ''}"><span class="c">${f.found ? '발견' : '???'}</span><span>${esc(f.section)}</span><b style="margin-left:auto">${f.found ? (f.card ? esc(f.card) : '이름은 2라운드에 공개') : '· · ·'}</b>${f.found ? `<span class="muted">${f.groups}모둠</span>` : ''}</div>`).join('')}</div>
      <div class="paper"><h2>모둠별 수사 기록</h2>${Object.keys(D.progress).map(g => { const n = D.progress[g].finds; const m = Math.max(1, ...Object.values(D.progress).map(p => p.finds)); return `<div class="bar"><span style="width:60px">${g}모둠</span><span class="b" style="width:${Math.max(4, 260 * n / m)}px"></span><span>${n}</span></div>`; }).join('')}
      <p class="muted">${peek ? '문장을 누르면 그 문장에 달린 의견을 볼 수 있어요.' : '발견 위치는 가려 두었어요. 수사가 끝나면 위 [🔒 발견 위치 가림]을 눌러 함께 보세요.'}</p></div>`;
  }
  return `<div class="col paper" style="flex:1.5;margin:0">${text}</div><div class="col" style="flex:1">${side}</div>`;
}

/* 2 복원 진행: 모둠별 글 전체 */
function vRewrite() {
  return `<div class="col grid">` + Object.keys(D.progress).map(g => {
    const ch = D.changes[g] || [], es = D.essays[g] || [];
    const changedSecs = new Set(ch.map(c => c.sec));
    return `<div class="paper"><h2>${g}모둠 <span class="status ${ch.length ? '' : 'no'}">고친 문장 ${ch.length}개</span></h2>` +
      es.map(s => `<h3>${esc(s.name)} ${changedSecs.has(s.name) ? '<span class="status">· 고침</span>' : ''}</h3><div class="${changedSecs.has(s.name) ? 'rw' : 'orig'}">${esc(s.text)}</div>`).join('') + `</div>`;
  }).join('') + `</div>`;
}

/* 3 상호 심사: 고친 문장별 판정 */
function vReview() {
  const groups = Object.keys(D.progress).map(Number);
  if (groups.indexOf(gtab) < 0) gtab = groups[0];
  const ch = D.changes[gtab] || [];
  const rl = D.rlines.filter(r => r.target === gtab);
  const reviewer = groups.find(g => g % groups.length + 1 === gtab);
  const all = D.reviews.filter(r => r.target === gtab).pop();
  return `<div class="col" style="flex:1.7"><div class="gtabs">${groups.map(g => `<button data-gt="${g}" class="${g === gtab ? 'on' : ''}">${g}모둠 복원본</button>`).join('')}</div>
      <div class="paper"><h2>${gtab}모둠이 고친 문장 ${ch.length}개 <span class="muted">· 심사: ${reviewer}모둠</span></h2>` +
    (ch.map(c => { const v = rl.filter(r => r.key === c.key); const ok = v.filter(x => x.verdict === 'ok').length, no = v.filter(x => x.verdict === 'no').length;
      return `<div class="cm ${ok ? 'full' : no ? 'part' : ''}"><div class="m">${esc(c.sec)} · ${esc(c.who || '')}(${esc(c.role)}) ${v.length ? `· ${ok ? '👍 타당해요' : '🤔 아쉬워요'}` : '· 심사 전'}</div>
        ${c.added ? '' : `<div style="color:var(--ink-soft);${c.del ? 'text-decoration:line-through' : ''}">${esc(c.orig)}</div>`}
        ${c.del ? '' : `<div style="margin-top:4px">→ <b>${esc(c.text)}</b></div>`}
        <div class="m" style="margin-top:4px">바꾼 이유: ${esc(c.reason || '')}</div>${v.filter(x => x.comment).map(x => `<div class="m">심사 한마디: “${esc(x.comment)}”</div>`).join('')}</div>`; }).join('') || '<p class="muted">아직 고친 문장이 없어요.</p>') +
    `</div></div><div class="col" style="flex:1"><div class="paper"><h2>심사 결과</h2><div class="bar"><span style="flex:1">👍 타당해요</span><b>${rl.filter(x => x.verdict === 'ok').length}</b></div><div class="bar"><span style="flex:1">🤔 아쉬워요</span><b>${rl.filter(x => x.verdict === 'no').length}</b></div>
      <div class="bar"><span style="flex:1">심사 안 한 문장</span><b>${ch.length - rl.length}</b></div></div>
      <div class="paper"><h2>${reviewer}모둠의 한 줄 평</h2>${all ? `<div class="cm">${esc(all.comment)}</div>` : '<p class="muted">아직 없어요.</p>'}</div>
      <div class="paper"><h2>심사 진행</h2>${groups.map(g => `<div class="bar"><span style="width:150px">${g}모둠 → ${g % groups.length + 1}모둠</span><span>${D.progress[g].reviews} / ${D.progress[g].toReview}</span></div>`).join('')}</div></div>`;
}

/* 4 베스트 투표: 구간별 실시간 집계 */
function partsHTML(parts) { return parts.map(p => p.c ? `<span style="text-decoration:underline 3px var(--ok);text-underline-offset:5px">${esc(p.t)}</span>` : esc(p.t)).join(' '); }
function vVote() {
  const V = D.vote || { sections: [], tally: {}, voters: 0 };
  return `<div class="col grid vgrid">` + `<div class="paper" style="grid-column:1/-1;display:flex;align-items:center;gap:16px"><h2 style="margin:0">구간별 베스트 투표</h2><span class="muted" style="font-size:.8em">투표한 기기 ${V.voters}대 · ${peek ? '지금 칠판에 모둠 이름과 득표가 보여요' : '모둠 이름과 득표는 가려 두었어요 (결과 공개에서 확인)'}</span></div>` +
    V.sections.map(sec => {
      if (!sec.cands.length) return `<div class="paper"><h2>${esc(sec.name)}</h2><p class="muted">고친 모둠이 없어요 (원문 사용)</p></div>`;
      const max = Math.max(1, ...sec.cands.map(c => V.tally[sec.name + '|' + c.g] || 0));
      return `<div class="paper"><h2>${esc(sec.name)}</h2>` + shuffleFor(sec.cands, (D.state.cls || '') + '|' + sec.name).map((c, i) => { const n = V.tally[sec.name + '|' + c.g] || 0;
        if (!peek) return `<div class="cm"><div class="m" style="white-space:nowrap"><b>${i + 1}안</b></div>${partsHTML(c.parts)}</div>`;
        return `<div class="cm ${n === max && n ? 'full' : ''}"><div class="m" style="white-space:nowrap"><b>${i + 1}안</b> <span class="muted">(${c.g}모둠)</span> · 👍 ${n}표 <span style="display:inline-block;height:10px;border-radius:5px;background:var(--stamp);width:${80 * n / max}px;margin-left:6px"></span></div>${partsHTML(c.parts)}</div>`; }).join('') + `</div>`;
    }).join('') + `</div>`;
}

/* 5 결과: 순위 → 완성된 보고서 → 완성도 → 오늘 잡은 결함 → 다음 시간 */
let rtab = 'rank';
const NEXT_NOTICE = [
  '오늘 찾은 결함들은 여러분 초안에도 숨어 있을 수 있어요.',
  '다음 시간에는 여러분이 직접 쓴 초안을 이름을 가린 익명으로 바꿔서 동료평가, 교사평가, AI 평가를 함께 진행합니다. 오늘 쓴 결함 카드가 그때의 평가 기준이 됩니다.',
  '평가가 끝나면 받은 피드백을 바탕으로 초안을 직접 고치는 시간을 드립니다.'
];
function vResult() {
  if (!D.result) {
    return `<div class="col" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px"><div class="stamp" style="font-size:2.4em;background:var(--paper)">수사 종료</div>
      <div style="color:#e8efec;font-size:1em">과연 명탐정은 어느 모둠일까?</div>${teacher() ? '<button class="tool red" id="reveal" style="font-size:24px;padding:14px 30px">결과 공개</button>' : ''}</div>`;
  }
  const R = D.result;
  const tabs = [['rank', '① 최종 순위'], ['report', '② 우리 반 보고서'], ['score', '③ 완성도'], ['caught', '④ 오늘 잡은 결함'], ['next', '⑤ 다음 시간']];
  const head = `<div class="gtabs" style="grid-column:1/-1">${tabs.map(t => `<button data-rt="${t[0]}" class="${rtab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div>`;
  let body = '';
  if (rtab === 'rank') {
    const order = R.rank.map((r, i) => ({ ...r, place: i + 1 }));
    body = `<div class="paper" style="max-width:1000px;margin:0 auto;width:100%"><h2>최종 순위 <span class="muted">만점 ${R.max}점</span></h2><div id="ranks">${order.map(r => `<div class="rank ${r.place === 1 ? 'first' : ''} ${revealDone ? 'in' : ''}" data-place="${r.place}"><span class="no">${r.place}위</span><div><b>${r.group}모둠</b> · ${r.total}점<div class="det">결함 ${r.flawsFound}개 · 발견 ${r.find} · 역할 보너스 ${r.bonus} · 타당해요 ${r.review} · 힌트 −${r.hint}</div></div><span class="gr">${esc(r.grade)}</span></div>`).join('')}</div></div>`;
  } else if (rtab === 'report') {
    body = `<div class="paper" style="max-width:1200px;margin:0 auto;width:100%"><h2>우리 반이 함께 완성한 보고서 <span class="muted">구간마다 투표 1등 글</span></h2>` +
      R.restored.map(s => `<h3>${esc(s.name)} ${s.by ? `<span class="status">· ${s.by}모둠 · 👍 ${s.votes}표</span>` : '<span class="muted">· 원문</span>'}</h3><div class="rw">${partsHTML(s.parts)}</div>`).join('') + `</div>`;
  } else if (rtab === 'score') {
    body = `<div class="paper" style="max-width:1200px;margin:0 auto;width:100%"><div style="display:flex;align-items:center;gap:30px"><div><div class="muted">모범 답안과 비교한 완성도</div><div class="big">${R.overall}<small>%</small></div></div><div class="muted" style="font-size:.8em">처음 보고서(원문)는 ${R.overallBefore}%였어요.<br>핵심 요소가 들어갔는지(70%)와 모범 답안과 얼마나 비슷한지(30%)로 계산했어요.</div></div>` +
      R.restored.map(s => s.done ? `<div class="cm"><div class="m"><b>${esc(s.name)}</b> · ${s.before ? s.before.pct : 0}% → <b style="color:var(--stamp)">${s.done.pct}%</b> · 핵심 요소 ${s.done.hit}/${s.done.total}${s.done.missing.length ? ` · 빠진 요소: ${esc(s.done.missing.join(', '))}` : ''}</div>
        <div class="bar"><span class="b" style="width:${Math.max(4, 6 * s.done.pct)}px;max-width:600px"></span></div>
        <details><summary class="m" style="cursor:pointer">모범 답안 보기</summary><div style="margin-top:6px">${esc(s.model)}</div></details></div>` : '').join('') + `</div>`;
  } else if (rtab === 'caught') {
    body = `<div class="paper" style="max-width:1200px;margin:0 auto;width:100%"><h2>오늘 우리가 잡은 결함</h2>` +
      R.caught.map(f => `<div class="cm ${f.groups ? 'full' : 'part'}"><div class="m">${esc(f.section)} · ${f.groups ? f.groups + '개 모둠이 찾음' : '아무도 못 찾음'}</div><b style="font-size:1.05em">${esc(f.card)}</b> · ${esc(f.note)}</div>`).join('') + `</div>`;
  } else {
    body = `<div class="paper" style="max-width:1100px;margin:0 auto;width:100%;padding:34px 40px"><h2 style="font-size:1.4em">다음 시간 안내</h2>${NEXT_NOTICE.map(p => `<p style="font-size:1.05em;line-height:1.8;margin:0 0 14px">${esc(p)}</p>`).join('')}
      <div style="display:flex;gap:14px;margin-top:20px;flex-wrap:wrap">${['① 내 초안 익명 공유', '② 동료평가 · 교사평가 · AI 평가', '③ 피드백 반영해 초안 고치기'].map(x => `<div class="stamp" style="font-size:.85em;transform:none;background:#fff">${x}</div>`).join('')}</div></div>`;
  }
  return `<div class="col" style="flex:1">${head}${body}</div>`;
}

function render() {
  if (!B || !D) return;
  renderHeader();
  const keep = [...document.querySelectorAll('.col')].map(c => c.scrollTop);
  if (!D.state.cls) { $('wrap').innerHTML = `<div class="col" style="flex:1;display:flex;align-items:center;justify-content:center;color:#e8efec;font-size:1.1em;text-align:center">아직 열린 반이 없어요.<br>교사 로그인 → 반·기록 관리에서 오늘 수업할 반을 열어 주세요.</div>`; return; }
  let html;
  try { html = [vBrief, vFind, vRewrite, vReview, vVote, vResult][phase()](); }
  catch (err) { html = `<div class="col" style="flex:1;color:#fff;padding:20px">이 단계 화면을 그리다 문제가 생겼어요. 이 화면을 캡처해 주세요.<br><small>${esc(B.phases[phase()] || '')} · ${esc(err && err.message || err)}</small></div>`; }
  $('wrap').innerHTML = html;
  document.querySelectorAll('.col').forEach((c, i) => { if (keep[i]) c.scrollTop = keep[i]; });
  if (phase() === 0 && window.QRCode && $('qr')) new QRCode($('qr'), { text: studentURL, width: 220, height: 220 });
  if (phase() === 5 && D.result && !revealDone) runReveal();
}

/* ---------- 반·기록 관리 ---------- */
let A = null, aType = '', aGroup = 0, aHidden = false;
const TYPE_NAME = { find: '결함 수사', hint: '힌트', line: '고친 문장', rline: '문장 심사', review: '한 줄 평', vote: '투표' };
function openAdmin() { $('admin').classList.add('show'); loadAdmin(); }
function loadAdmin() { return call('admin', pin).then(a => { A = a; renderAdmin(); }).catch(err => { $('adminBox').innerHTML = esc(err); }); }
function summary(e) {
  if (e.type === 'find') return `${e.card}${e.problem ? ' · ' + e.problem : ''} <span class="muted">(${e.result.split(':')[0] === 'full' ? '정답' : e.result.split(':')[0] === 'part' ? '문장만' : '기록'})</span>`;
  if (e.type === 'hint') return esc(e.problem);
  if (e.type === 'rewrite') return `<b>${esc(e.target)}</b> ${esc(e.fix.slice(0, 80))}${e.fix.length > 80 ? '…' : ''}`;
  if (e.type === 'line') { const k = /^\d+-\d+$/.test(e.key) ? `${secName(e.key)} ${Number(e.key.split('-')[1]) + 1}번째` : esc(e.target) + ' 새 문장'; return e.card === 'del' ? `${k} · 문장 삭제 <span class="muted">(${esc(e.problem)})</span>` : `${k} · ${esc(e.fix.slice(0, 70))}${e.fix.length > 70 ? '…' : ''} <span class="muted">(이유: ${esc(e.problem)})</span>`; }
  if (e.type === 'rline') return `${esc(e.target)}모둠 ${/^\d+-\d+$/.test(e.key) ? esc(secName(e.key)) : '새 문장'} · ${e.card === 'ok' ? '👍 타당해요' : '🤔 아쉬워요'}${e.problem ? ' · ' + esc(e.problem) : ''}`;
  if (e.type === 'vote') return `${esc(e.target)} · ${esc(e.card)}모둠 글에 투표`;
  if (e.type === 'review') return `${esc(e.target)}모둠에게 · ${esc(e.problem)}`;
  if (e.type === 'self') return `${esc(e.card)} · ${esc(e.problem)} → ${esc(e.fix)}`;
  return '';
}
function renderAdmin() {
  if (!A) return;
  const rec = A.records.filter(e => (!aType || e.type === aType) && (!aGroup || e.group === aGroup) && (aHidden || !e.hidden));
  const groups = B.groups || 4;
  $('adminBox').innerHTML = `<div class="adm"><div style="display:flex;align-items:center"><b style="font-size:20px;font-family:var(--display)">반·기록 관리</b><button class="tool" id="adminClose" style="margin-left:auto;background:#fff;color:var(--ink)">닫기</button></div>
    <h3>오늘 수업할 반 열기</h3><p class="muted" style="font-size:13px;margin:0 0 8px">반을 열면 학생 태블릿은 그 반 게임으로 바뀝니다. 반마다 기록과 진행 단계가 따로 저장돼서, 나중에 다시 열면 그 반 결과를 그대로 볼 수 있어요.</p>
    <div class="cls">${A.classes.map(c => `<button data-cls="${esc(c.name)}" class="${c.name === A.cur ? 'on' : ''}">${esc(c.name)}<small>기록 ${c.count}개 · ${esc(B.phases[c.phase] || '')}</small></button>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="newCls" placeholder="반 추가 (예: 2-7반)" maxlength="20"><button class="sbtn" id="addCls">추가</button></div>
    ${A.cur ? `<h3>${esc(A.cur)} 관리</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sbtn" id="toBrief">브리핑 단계로 되돌리기</button><button class="sbtn red" id="resetCls">${esc(A.cur)} 기록 모두 지우고 처음부터</button></div>
    <p class="muted" style="font-size:13px">지운 기록은 시트의 기록 탭에 '초기화'/'교사 숨김'으로 남아 있어서, 아래 목록에서 '지운 것도 보기'를 켜면 되살릴 수 있어요.</p>
    <h3>${esc(A.cur)} 기록 ${rec.length}개</h3>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
      <select id="aType"><option value="">모든 종류</option>${Object.keys(TYPE_NAME).map(k => `<option value="${k}" ${aType === k ? 'selected' : ''}>${TYPE_NAME[k]}</option>`).join('')}</select>
      <select id="aGroup"><option value="0">모든 모둠</option>${Array.from({ length: groups }, (_, i) => `<option value="${i + 1}" ${aGroup === i + 1 ? 'selected' : ''}>${i + 1}모둠</option>`).join('')}</select>
      <label style="font-size:14px"><input type="checkbox" id="aHidden" ${aHidden ? 'checked' : ''}> 지운 것도 보기</label></div>
    <table><tr><th>시각</th><th>모둠</th><th>종류</th><th>내용</th><th></th></tr>${rec.map(e => `<tr class="${e.hidden ? 'hid' : ''}"><td>${e.time ? new Date(e.time).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : ''}</td><td>${e.group}모둠<br><span class="muted">${esc(e.role)}${e.who ? ' · ' + esc(e.who) : ''}</span></td><td>${TYPE_NAME[e.type] || esc(e.type)}</td><td>${summary(e)}</td>
      <td>${e.hidden ? `<button class="sbtn" data-unhide="${esc(e.id)}">되살리기</button>` : `<button class="sbtn" data-del="${esc(e.id)}">지우기</button>`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">기록이 없어요.</td></tr>'}</table>` : '<p class="muted">위에서 반을 먼저 열어 주세요.</p>'}</div>`;
}
function adminAct(p) { return p.then(() => Promise.all([loadAdmin(), poll(true)])).catch(err => alertBar(err)); }

function runReveal() {
  revealDone = true;
  const items = [...document.querySelectorAll('.rank')].sort((a, b) => Number(b.dataset.place) - Number(a.dataset.place));
  items.forEach((el, i) => setTimeout(() => el.classList.add('in'), 700 + i * (i === items.length - 1 ? 1600 : 1100)));
}

let lastSig = '';
function poll(force) {
  return call('board', pin).then(d => {
    const sig = JSON.stringify(d);
    if (D && (D.state.phase !== d.state.phase || D.state.cls !== d.state.cls)) { sel = null; cardSel = ''; peek = false; if (D.state.cls !== d.state.cls) revealDone = false; }
    const changed = sig !== lastSig; D = d; lastSig = sig;
    if (force || changed) render();
  }).catch(err => { if (!D) $('wrap').innerHTML = `<div class="col" style="color:#fff">연결하지 못했어요: ${esc(err)}</div>`; });
}

function go(n, reveal) {
  if (!teacher()) return;
  call('setPhase', pin, n, !!reveal).then(() => poll(true)).catch(err => alertBar(err));
}
function alertBar(t) { $('timer').textContent = String(t).slice(0, 30); }

document.addEventListener('click', e => {
  const t = e.target;
  const k = t.closest('[data-k]'); if (k && phase() === 1 && peek) { sel = sel === k.dataset.k ? null : k.dataset.k; render(); return; }
  const h = t.closest('[data-hide]'); if (h) { h.disabled = true; call('toggleHide', pin, h.dataset.hide).then(() => poll(true)); return; }
  const rtb = t.closest('[data-rt]'); if (rtb) { rtab = rtb.dataset.rt; render(); return; }
  const gt = t.closest('[data-gt]'); if (gt) { gtab = Number(gt.dataset.gt); render(); return; }
  const cs = t.closest('[data-cs]'); if (cs) { cardSel = cs.dataset.cs; render(); return; }
  const ph = t.closest('[data-ph]'); if (ph && teacher()) { go(Number(ph.dataset.ph)); return; }
  if (t.id === 'next') {
    if (phase() === 2) {
      const left = Object.keys(D.progress).filter(g => !D.progress[g].lines);
      if (left.length && !confirm2(t, left.join(', ') + '모둠 고친 문장 0개! 그래도 넘기기')) return;
    }
    if (phase() === 3) {
      const left = Object.keys(D.progress).filter(g => D.progress[g].reviews < D.progress[g].toReview);
      if (left.length && !confirm2(t, left.join(', ') + '모둠 심사 덜 함! 그래도 넘기기')) return;
    }
    return go(Math.min(5, phase() + 1));
  }
  if (t.id === 'peek') { peek = !peek; sel = null; render(); return; }
  if (t.id === 'prev') return go(Math.max(0, phase() - 1));
  if (t.id === 'reveal') { revealDone = false; rtab = 'rank'; return go(5, true); }
  if (t.id === 'plus') { fs = Math.min(40, fs + 2); store('case_fs', fs); render(); return; }
  if (t.id === 'minus') { fs = Math.max(14, fs - 2); store('case_fs', fs); render(); return; }
  if (t.id === 'adminBtn') return openAdmin();
  if (t.id === 'adminClose') { $('admin').classList.remove('show'); return; }
  const cl = t.closest('[data-cls]'); if (cl) { if (cl.dataset.cls === A.cur) return; if (!confirm2(cl, cl.dataset.cls + ' 열기?')) return; revealDone = false; return adminAct(call('openClass', pin, cl.dataset.cls)); }
  if (t.id === 'addCls') { const v = $('newCls').value.trim(); if (v) adminAct(call('addClass', pin, v)); return; }
  if (t.id === 'toBrief') { if (!confirm2(t, '한 번 더 누르면 브리핑으로')) return; return adminAct(call('setPhase', pin, 0, false)); }
  if (t.id === 'resetCls') { if (!confirm2(t, '정말 지울까요? 한 번 더 누르세요')) return; revealDone = false; return adminAct(call('resetClass', pin)); }
  const dl = t.closest('[data-del]'); if (dl) return adminAct(call('setHidden', pin, dl.dataset.del, true));
  const uh = t.closest('[data-unhide]'); if (uh) return adminAct(call('setHidden', pin, uh.dataset.unhide, false));
  if (t.id === 'loginBtn') { $('login').classList.add('show'); $('pin').focus(); return; }
  if (t.id === 'pinCancel') { $('login').classList.remove('show'); return; }
  if (t.id === 'pinOk') {
    const v = $('pin').value;
    call('checkPin', v).then(ok => {
      if (!ok) { $('pinMsg').textContent = '비밀번호가 맞지 않아요.'; return; }
      pin = v; sessionSet('case_pin', v); $('login').classList.remove('show'); poll(true).then(() => { if (!D.state.cls) openAdmin(); });
    });
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'aType') { aType = e.target.value; renderAdmin(); }
  if (e.target.id === 'aGroup') { aGroup = Number(e.target.value); renderAdmin(); }
  if (e.target.id === 'aHidden') { aHidden = e.target.checked; renderAdmin(); }
});
function confirm2(btn, label) {
  if (btn.dataset.armed) return true;
  const old = btn.innerHTML; btn.dataset.armed = '1'; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.innerHTML = old; } }, 3000);
  return false;
}
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('pinOk').click(); });

/* 단계 시간 */
setInterval(() => {
  if (!D || !D.state.at) { $('timer').textContent = ''; return; }
  const s = Math.max(0, Math.floor((Date.now() - D.state.at) / 1000));
  $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}, 1000);

call('boot').then(b => { B = b; return poll(true); }).catch(err => { $('wrap').innerHTML = `<div class="col" style="color:#fff">연결하지 못했어요: ${esc(err)}</div>`; });
setInterval(() => { if (B && document.visibilityState === 'visible') poll(false); }, 4000);
</script>
</body>
</html>
